const U={ov:['Lesson overview','Tổng quan bài học'],start:['Start Learning','Bắt đầu học'],voc:['Vocabulary','Từ vựng'],fin:['Final Assessment','Kiểm tra cuối bài'],prog:['My Progress','Tiến trình của tôi'],obj:['Learning objectives','Mục tiêu học tập'],key:['Key concepts','Kiến thức trọng tâm'],ws:['Learning worksheet','Phiếu học tập'],chk:['Check','Kiểm tra'],okm:['✓ Correct! Excellent!','✓ Chính xác! Tuyệt vời!'],nom:['✗ Not quite. Try again.','✗ Chưa đúng. Hãy thử lại.'],done:['Mark section complete','Đánh dấu hoàn thành'],ans:['Answer','Đáp án'],name:['Name','Họ tên'],cls:['Class','Lớp'],date:['Date','Ngày'],print:['Print worksheet','In phiếu học tập'],reset:['Reset','Làm lại'],sub:['Submit','Nộp bài'],home:['Home','Trang chủ'],type:['Your answer…','Câu trả lời…'],T:['True','Đúng'],F:['False','Sai']};

const SEC=[
{t:['1. Concept & composition','1. Khái niệm và thành phần'],o:[['State what a biological molecule is.','Nêu được khái niệm phân tử sinh học.'],['Name the main groups and the elements they contain.','Kể tên các nhóm chính và nguyên tố cấu tạo.']],k:[['Biological molecules are organic molecules made and found in living cells.','Phân tử sinh học là phân tử hữu cơ được tổng hợp và tồn tại trong tế bào sống.'],['Main groups: protein, lipid, carbohydrate, nucleic acid.','Gồm protein, lipid, carbohydrate, nucleic acid.'],['Protein, carbohydrate and nucleic acid are macromolecules built from many monomers (polymers).','Protein, carbohydrate, nucleic acid là đại phân tử đa phân (polymer).'],['Carbon and hydrogen form a hydrocarbon skeleton; functional groups (amino, carboxyl…) add variety.','C và H tạo bộ khung hydrocarbon; các nhóm chức (amino, carboxyl…) tạo sự đa dạng.']]},
{t:['2. Carbohydrate','2. Carbohydrate – chất đường bột'],o:[['Describe the three groups of carbohydrates.','Trình bày ba nhóm carbohydrate.'],['Link structure to function (starch, glycogen, cellulose).','Liên hệ cấu trúc – chức năng.']],k:[['Made of C, H, O (ratio 1:2:1), general formula Cn(H2O)m.','Gồm C, H, O (tỉ lệ 1:2:1), công thức Cn(H2O)m.'],['Monosaccharides (glucose, fructose, galactose): energy source and building material.','Đường đơn: nguồn năng lượng và nguyên liệu cấu tạo.'],['Disaccharides (sucrose, maltose, lactose) form by a glycosidic bond, losing one water.','Đường đôi hình thành nhờ liên kết glycosidic, loại 1 phân tử nước.'],['Polysaccharides: starch (plant energy storage), glycogen (animal storage), cellulose (plant cell wall), chitin (exoskeleton of shrimp, crab, insects; fungal cell walls).','Đường đa: tinh bột (dự trữ ở thực vật), glycogen (dự trữ ở động vật), cellulose (thành tế bào thực vật), chitin (vỏ ngoài tôm, cua, côn trùng; thành tế bào nấm).']]},
{t:['3. Lipid','3. Lipid – chất béo'],o:[['Describe the structure and roles of fats, phospholipids, steroids.','Mô tả cấu trúc và vai trò của mỡ, phospholipid, steroid.'],['Explain why lipids are hydrophobic.','Giải thích vì sao lipid kị nước.']],k:[['Lipids are diverse but share hydrophobicity (many nonpolar C–H bonds).','Lipid đa dạng nhưng cùng đặc tính kị nước (nhiều liên kết C–H không phân cực).'],['Triglyceride = 1 glycerol + 3 fatty acids; long-term energy storage, insulation, solvent for vitamins A, D, E, K.','Triglyceride = 1 glycerol + 3 axit béo; dự trữ năng lượng, cách nhiệt, hòa tan vitamin A, D, E, K.'],['Phospholipid: hydrophilic head + 2 hydrophobic tails; forms cell membranes.','Phospholipid: đầu ưa nước + 2 đuôi kị nước; cấu tạo màng tế bào.'],['Steroids (cholesterol, testosterone, estrogen) have 4 carbon rings. HDL carries cholesterol to the liver; high LDL raises the risk of heart disease.','Steroid có 4 vòng carbon. HDL vận chuyển cholesterol về gan; LDL cao làm tăng nguy cơ tim mạch.']]},
{t:['4. Protein','4. Protein – chất đạm'],o:[['List functions of proteins.','Nêu các chức năng của protein.'],['Describe the four levels of structure and denaturation.','Mô tả 4 bậc cấu trúc và sự biến tính.']],k:[['Functions: structure, catalysis (enzymes), defense (antibodies), movement, signal reception, regulation.','Chức năng: cấu trúc, xúc tác, bảo vệ, vận động, tiếp nhận thông tin, điều hòa.'],['Monomer = amino acid (central C, amino group, carboxyl group, H, R group). Linked by peptide bonds.','Đơn phân là amino acid (C trung tâm, nhóm amino, carboxyl, H, nhóm R), nối bằng liên kết peptide.'],['20 amino acids; 9 are essential (must come from food).','Có 20 amino acid; 9 loại không thay thế (lấy từ thức ăn).'],['Levels 1–4: sequence → coil/fold → 3D shape → several chains. Heat, pH… break weak bonds = denaturation.','Bậc 1–4: trình tự → xoắn/gấp nếp → không gian 3 chiều → nhiều chuỗi. Nhiệt, pH… phá liên kết yếu = biến tính.']]},
{t:['5. Nucleic acid','5. Nucleic acid'],o:[['Compare DNA and RNA.','So sánh DNA và RNA.'],['Explain why DNA suits its role of storing information.','Giải thích cấu trúc DNA phù hợp chức năng mang thông tin.']],k:[['DNA: two antiparallel polynucleotide chains; nucleotide = phosphate + deoxyribose + base (A, T, G, C).','DNA: hai chuỗi polynucleotide song song ngược chiều; nucleotide = phosphate + deoxyribose + base (A, T, G, C).'],['Complementary pairing: A=T (2 H bonds), G≡C (3 H bonds). So A = T and G = C in amount.','Bổ sung: A=T (2 liên kết H), G≡C (3 liên kết H). Nên A = T, G = C về số lượng.'],['RNA: one chain, ribose, bases A, U, G, C (no T). Types: mRNA, tRNA, rRNA.','RNA: một chuỗi, đường ribose, base A, U, G, C (không có T). Gồm mRNA, tRNA, rRNA.'],['Flow: DNA → (transcription) mRNA → (translation) protein. DNA fingerprinting uses repeated sequences unique to each person.','DNA → (phiên mã) mRNA → (dịch mã) protein. Dấu vân tay DNA dựa vào các trình tự lặp đặc trưng.']]}];
const Q=[
{s:0,l:1,t:'mc',q:['Which are the main groups of biological molecules?','Các nhóm phân tử sinh học chính là?'],o:[['Carbohydrate, lipid, protein, nucleic acid','Carbohydrate, lipid, protein, nucleic acid'],['Water, salts, vitamins, gases','Nước, muối, vitamin, khí'],['Only proteins and lipids','Chỉ protein và lipid'],['Only DNA and RNA','Chỉ DNA và RNA']],a:0,e:['These four organic groups are the main biological molecules.','Đây là bốn nhóm hữu cơ chính.']},
{s:0,l:2,t:'tf',q:['Proteins, carbohydrates and nucleic acids are polymers made of many monomers.','Protein, carbohydrate, nucleic acid là polymer gồm nhiều đơn phân.'],a:0,e:['They follow the multimer principle.','Chúng cấu tạo theo nguyên tắc đa phân.']},
{s:0,l:1,t:'fill',q:['The main elements of biological molecules are carbon and ____ .','Nguyên tố chính của phân tử sinh học là carbon và ____ .'],a:['hydrogen','hidro','hydro'],e:['C and H form the hydrocarbon skeleton.','C và H tạo bộ khung hydrocarbon.']},
{s:1,l:1,t:'mc',q:['Which molecule is the main component of plant cell walls?','Phân tử nào là thành phần chính của thành tế bào thực vật?'],o:[['Glycogen','Glycogen'],['Cellulose','Cellulose'],['Starch','Tinh bột'],['Protein','Protein']],a:1,e:['Cellulose forms straight, unbranched chains bundled into strong fibres.','Cellulose tạo mạch thẳng, bó thành sợi vững chắc.']},
{s:1,l:2,t:'mc',q:['Why are disaccharides such as sucrose called "transport sugars"?','Vì sao đường đôi như sucrose gọi là đường vận chuyển?'],o:[['They are not broken down during transport','Không bị phân giải trong quá trình vận chuyển'],['They are insoluble','Không tan trong nước'],['They are made of fatty acids','Cấu tạo từ axit béo'],['They store energy for years','Dự trữ năng lượng nhiều năm']],a:0,e:['Organisms move glucose around as disaccharides.','Sinh vật vận chuyển glucose dưới dạng đường đôi.']},
{s:1,l:2,t:'tf',q:['Glucose and fructose have the same formula (C6H12O6) but different properties.','Glucose và fructose cùng công thức C6H12O6 nhưng tính chất khác nhau.'],a:0,e:['Different structures give different properties.','Cấu trúc khác nhau nên tính chất khác nhau.']},
{s:1,l:3,t:'mc',q:['A student eats rice before a sports match. Which molecule mainly provides energy?','Học sinh ăn cơm trước khi thi đấu thể thao. Phân tử nào chủ yếu cung cấp năng lượng?'],o:[['Starch → glucose','Tinh bột → glucose'],['Cellulose','Cellulose'],['DNA','DNA'],['Cholesterol','Cholesterol']],a:0,e:['Rice is rich in starch, digested to glucose.','Cơm giàu tinh bột, được tiêu hóa thành glucose.']},
{s:2,l:1,t:'mc',q:['A triglyceride consists of:','Triglyceride gồm:'],o:[['1 glycerol + 3 fatty acids','1 glycerol + 3 axit béo'],['3 glycerol + 1 fatty acid','3 glycerol + 1 axit béo'],['Amino acids','Các amino acid'],['Nucleotides','Các nucleotide']],a:0,e:['Glycerol bonds with three fatty acids.','Glycerol liên kết với ba axit béo.']},
{s:2,l:2,t:'tf',q:['Lipids are hydrophobic because they contain many nonpolar C–H bonds.','Lipid kị nước vì chứa nhiều liên kết C–H không phân cực.'],a:0,e:['Nonpolar bonds do not mix with water.','Liên kết không phân cực không hòa tan trong nước.']},
{s:2,l:2,t:'mc',q:['Why is a phospholipid amphipathic (two-sided)?','Vì sao phospholipid là phân tử lưỡng cực?'],o:[['Hydrophilic head and hydrophobic tails','Đầu ưa nước và đuôi kị nước'],['Two glycerol molecules','Có hai glycerol'],['Four carbon rings','Có 4 vòng carbon'],['Contains amino acids','Chứa amino acid']],a:0,e:['This structure lets it form membranes.','Cấu trúc này giúp tạo màng tế bào.']},
{s:2,l:3,t:'mc',q:['A person has very high LDL. What is the main risk?','Một người có LDL rất cao. Nguy cơ chính là gì?'],o:[['Cholesterol builds up in artery walls → heart disease','Cholesterol tích tụ ở thành mạch → bệnh tim mạch'],['Lack of vitamin C','Thiếu vitamin C'],['Cellulose deficiency','Thiếu cellulose'],['No risk','Không có nguy cơ']],a:0,e:['LDL carries cholesterol to vessels where it can form plaques.','LDL mang cholesterol tới mạch máu, tạo mảng bám.']},
{s:3,l:1,t:'fill',q:['Proteins are polymers made from ____ .','Protein là polymer cấu tạo từ ____ .'],a:['amino acids','amino acid','axit amin'],e:['Amino acids are the monomers of proteins.','Amino acid là đơn phân của protein.']},
{s:3,l:1,t:'mc',q:['Which bond links two amino acids?','Liên kết nào nối hai amino acid?'],o:[['Peptide bond','Liên kết peptide'],['Glycosidic bond','Liên kết glycosidic'],['Phosphodiester bond','Liên kết phosphodiester'],['Ionic bond only','Chỉ liên kết ion']],a:0,e:['Formed by removing one water molecule.','Hình thành khi loại một phân tử nước.']},
{s:3,l:2,t:'mc',q:['Why does egg white turn solid when boiled?','Vì sao lòng trắng trứng đông lại khi luộc?'],o:[['Heat breaks weak bonds → denaturation','Nhiệt phá liên kết yếu → biến tính'],['Heat makes new amino acids','Nhiệt tạo amino acid mới'],['Water turns into protein','Nước biến thành protein'],['Peptide bonds are added','Thêm liên kết peptide']],a:0,e:['The 3D shape changes and function is lost.','Cấu trúc không gian thay đổi, mất chức năng.']},
{s:3,l:1,t:'tf',q:['There are 20 types of amino acids, and 9 of them are essential.','Có 20 loại amino acid, trong đó 9 loại không thay thế.'],a:0,e:['Essential amino acids must come from food.','Amino acid không thay thế phải lấy từ thức ăn.']},
{s:4,l:1,t:'mc',q:['In DNA, adenine (A) pairs with:','Trong DNA, adenine (A) liên kết với:'],o:[['Thymine by 2 hydrogen bonds','Thymine bằng 2 liên kết hydrogen'],['Guanine by 3 hydrogen bonds','Guanine bằng 3 liên kết hydrogen'],['Uracil by 2 hydrogen bonds','Uracil bằng 2 liên kết hydrogen'],['Cytosine by 3 hydrogen bonds','Cytosine bằng 3 liên kết hydrogen']],a:0,e:['A=T, G≡C.','A=T, G≡C.']},
{s:4,l:1,t:'fill',q:['RNA contains ____ instead of thymine.','RNA chứa ____ thay cho thymine.'],a:['uracil'],e:['RNA bases: A, U, G, C.','Base của RNA: A, U, G, C.']},
{s:4,l:2,t:'mc',q:['Which statement correctly compares DNA and RNA?','Nhận định nào so sánh đúng DNA và RNA?'],o:[['DNA: 2 chains, deoxyribose; RNA: 1 chain, ribose','DNA: 2 mạch, deoxyribose; RNA: 1 mạch, ribose'],['DNA: 1 chain; RNA: 2 chains','DNA: 1 mạch; RNA: 2 mạch'],['Both contain thymine','Cả hai đều có thymine'],['Both contain ribose','Cả hai đều có ribose']],a:0,e:['These are the main structural differences.','Đây là khác biệt cấu trúc chính.']},
{s:4,l:3,t:'mc',q:['Why can DNA fingerprinting help identify a suspect?','Vì sao dấu vân tay DNA giúp xác định nghi phạm?'],o:[['Repeated sequences are specific to each individual','Các trình tự lặp đặc trưng cho từng cá thể'],['Everyone has identical DNA','Mọi người có DNA giống hệt'],['It measures protein levels','Đo lượng protein'],['It reads cell walls','Đọc thành tế bào']],a:0,e:['Patterns on a gel are compared between samples.','So sánh các băng điện di giữa các mẫu.']},
{s:4,l:2,t:'tf',q:['In DNA, the amount of A always equals the amount of C.','Trong DNA, số lượng A luôn bằng số lượng C.'],a:1,e:['A equals T, and G equals C.','A bằng T, G bằng C.']}];
const RAW=[
['Carbohydrate','Carbohydrate (chất đường bột)','Carbohydrates are biological molecules that play important roles in energy supply and storage.','Carbohydrate là nhóm phân tử sinh học có vai trò quan trọng trong cung cấp và dự trữ năng lượng.','/ˌkɑːrboʊˈhaɪdreɪt/','Monosaccharide,Disaccharide,Polysaccharide,Glucose,Starch,Glycogen,Cellulose'],

['Common features of lipids: hydrophobic; not built on the multimer principle; chemically diverse.','Đặc điểm chung: kị nước; không cấu tạo theo nguyên tắc đa phân; thành phần hoá học đa dạng.'],

['Phospholipid is amphipathic: a hydrophilic head (phosphatidylcholine) and two hydrophobic fatty-acid tails. It forms the structure of cell membranes.','Phospholipid là phân tử lưỡng cực: đầu phosphatidylcholine ưa nước và hai đuôi acid béo kị nước; tạo nên cấu trúc màng tế bào.'],
['Steroids contain no fatty acids; their carbons form 4 rings (cholesterol, testosterone, estrogen, vitamin D, cortisone). Cholesterol is part of the cell membrane and the precursor of testosterone and estrogen.','Steroid không chứa acid béo, các carbon tạo 4 vòng (cholesterol, testosterone, estrogen, vitamin D, cortisone). Cholesterol là thành phần màng tế bào và là tiền chất tạo testosterone, estrogen.'],
['Carotenoids are yellow-orange plant pigments that are lipids; the body converts them to vitamin A. Fat-soluble vitamins are absorbed better when food (e.g. tomatoes) is cooked with oil or fat.','Carotenoid là sắc tố vàng cam ở thực vật thuộc lipid; cơ thể chuyển thành vitamin A. Vitamin tan trong dầu mỡ được hấp thụ tốt hơn khi nấu thức ăn (như cà chua) với dầu, mỡ.']],[

['Amino acid = central carbon + amino group (–NH2) + carboxyl group (–COOH) + H atom + side chain (R group). Amino acids differ in their R group.','Amino acid = carbon trung tâm + nhóm amino (–NH2) + nhóm carboxyl (–COOH) + nguyên tử H + chuỗi bên (nhóm R). Các amino acid khác nhau ở nhóm R.'],
['Pork, beef and chicken are all proteins but differ in amino acid composition, so their 3D shape and interactions differ, giving different flavour, toughness and firmness.','Thịt lợn, bò, gà đều là protein nhưng khác nhau về thành phần amino acid nên cấu hình không gian và tương tác khác nhau, dẫn đến mùi vị, độ dai, độ rắn chắc khác nhau.'],
['Diet: eat varied protein foods so the body gets all essential amino acids as raw material for making its own proteins.','Ăn uống: cần bổ sung protein từ nhiều loại thức ăn để cơ thể có đủ các amino acid cần thiết làm nguyên liệu tổng hợp protein.']],[
['DNA structure: two antiparallel polynucleotide chains (3’–5’ and 5’–3’) joined by hydrogen bonds; A pairs with T (2 hydrogen bonds), G with C (3 hydrogen bonds).','Cấu trúc DNA: hai chuỗi polynucleotide ngược chiều (3’–5’ và 5’–3’) liên kết bằng liên kết hydrogen; A–T (2 liên kết), G–C (3 liên kết).'],
['Structure suits function: two stable chains protect genetic information; complementary pairing lets cells repair damage using the intact strand as a template; two strands allow accurate DNA replication.','Cấu trúc phù hợp chức năng: hai mạch bền vững giúp bảo quản thông tin di truyền; nguyên tắc bổ sung giúp sửa sai, dùng mạch còn lại làm khuôn; hai mạch giúp nhân đôi DNA chính xác.'],
